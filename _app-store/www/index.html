<style>
  :root { --linen: #faf6f0; --ink: #1d1813; --muted: #6b5e51; --walnut: #5e4433; }

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--linen); color: var(--ink);
    font: 17px/1.5 system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font: 500 28px/1.1 Georgia, serif; margin: 0 0 10px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a { display: block; padding: 16px; border-radius: 14px; background: var(--walnut); color: var(--linen); text-decoration: none; font-weight: 600; margin-top: 10px; }
