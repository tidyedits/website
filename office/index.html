<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office login | Tidy Edits</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#faf6f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1511" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Owner door to the Tidy Edits Office. The Office itself sits behind a sign-in, so nothing private lives on this page. Neutrals only, see BRAND.md. */
:root {
  --linen: #faf6f0; --paper: #fffdf9; --ink: #1d1813; --muted: #6b5e51; --line: #e2d6c6; --walnut: #5e4433; --on-walnut: #fffdf9;
  --logo-filter: none;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --linen: #1a1511; --paper: #221c17; --ink: #f3ece2; --muted: #b9aa98; --line: #3a3027; --walnut: #d8c3a6; --on-walnut: #1a1511; --logo-filter: invert(1); color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100svh; background: var(--linen); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; display: grid; place-items: center; padding: 32px max(16px, env(safe-area-inset-left, 0px)); }
main { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 18px; }
img { width: 132px; height: auto; filter: var(--logo-filter); }
h1 { font-family: var(--display); font-weight: 500; font-size: 2.2rem; line-height: 1.05; margin: 0; letter-spacing: -.01em; }
p { margin: 0; color: var(--muted); }
.btn { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 12px 18px; border-radius: 14px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.btn.primary { background: var(--walnut); border-color: var(--walnut); color: var(--on-walnut); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
small { color: var(--muted); font-size: .85rem; }
small a { color: inherit; }
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="Tidy Edits" width="132" height="96">
  <h1>Office</h1>
  <p>Leads, quotes, bids, the schedule, clients, invoices and the team, in one place.</p>
  <a class="btn primary" href="https://claude.ai/artifact/3kdgwDCF2EjR45mh9zYgHL">Sign in to the Office</a>
  <a class="btn" href="/crew/">Crew clock-in</a>
  <small>The Office is private. It only opens for the owner's signed-in account. <a href="/">Back to tidyedits.com</a></small>
</main>
</body>
</html>
